<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar — fitted value, launch odds, costed farms</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="mast">
  <div class="brand"><span class="dot"></span> TOKEN LAUNCH RADAR</div>
  <h1>What each pre-token launch would be worth — and which farms pay to wait for it</h1>
  <p class="thesis-formula" id="thesisformula"></p>
  <p class="sub" id="subtitle"></p>
  <div class="kpis" id="kpis"></div>
  <div class="integrity" id="integrity"></div>
</header>

<main>
  <section class="ledger" id="ledger" aria-label="758-protocol ledger"></section>

  <div class="valstrip" id="valstrip" aria-label="Held-out validation summary"></div>

  <section class="topstrip" aria-label="A note to the judge and the best farms">
    <div class="judgebrief" id="judgebrief"></div>
    <div class="topfarms" id="topfarms"></div>
  </section>

  <section class="boardwrap">
    <div class="boardhead">
      <h2>Ranked board</h2>
      <div class="controls">
        <input id="q" type="search" placeholder="Search name or slug…" aria-label="Search">
        <select id="cat" aria-label="Category"><option value="">All categories</option></select>
        <select id="verdict" aria-label="Verdict">
          <option value="">All verdicts</option>
          <option>FARM</option><option>MARGINAL</option><option>SKIP</option>
        </select>
        <select id="sort" aria-label="Sort by">
          <option value="implied">Implied value ↓</option>
          <option value="tvl">TVL ↓</option>
          <option value="odds">Launch odds ↓</option>
          <option value="net">Farm net ↓</option>
          <option value="age">Age ↑</option>
        </select>
        <label class="wl"><input type="checkbox" id="watchonly"> Watchlist only</label>
      </div>
    </div>
    <div class="count" id="count"></div>
    <div class="tablewrap">
      <table id="board">
        <thead><tr>
          <th data-k="rank">#</th>
          <th data-k="name">Protocol</th>
          <th data-k="category">Category</th>
          <th data-k="tvl">TVL</th>
          <th data-k="value">Value if launches</th>
          <th data-k="odds">Odds</th>
          <th data-k="implied">Implied</th>
          <th data-k="range">P25–P75</th>
          <th data-k="verdict">Verdict</th>
          <th data-k="net">Net</th>
          <th data-k="netph">Net/hr</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note" id="boardnote"></p>
  </section>

  <section class="evidence" id="evidence" aria-label="Held-out validation"></section>

  <section class="scatter" id="scatter" aria-label="Market cap vs TVL scatter"></section>

  <section class="farm" id="farm" aria-label="Farm economics"></section>
</main>

<aside class="drawer" id="drawer" hidden>
  <button id="close" aria-label="Close detail">✕</button>
  <div id="detail"></div>
</aside>

<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
